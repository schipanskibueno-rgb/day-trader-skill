<title>Pregao Virtual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a trading floor at night. The 3D office takes the stage; the side panel reads like a terminal. */
:root {
  --bg: #0b1016; --panel: #111922; --panel-2: #17212c; --line: #223040; --text: #e4ebf2; --muted: #8b9cae;
  --accent: #f2b544; --buy: #3fd08f; --sell: #ff6b6b; --hold: #9db0c4; --info: #6cb6ff;
  --trade: #2dd4bf; --pesquisa: #a78bfa; --economia: #60a5fa; --lab: #f2b544; --direcao: #f472b6;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { min-height: 100%; display: flex; flex-direction: column; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; flex-wrap: wrap; align-items: center;
       gap: 6px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px));
       padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font: 700 18px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.brand .led { width: 10px; height: 10px; border-radius: 50%; background: var(--buy); box-shadow: 0 0 10px var(--buy); }
.brand .led.off { background: var(--muted); box-shadow: none; }
.brand small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: 0; text-transform: none; }
.status { color: var(--muted); font: 12px/1.3 var(--mono); }
.chip { font: 600 12px/1 var(--mono); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--hold); white-space: nowrap; }
.chip.on { color: var(--buy); border-color: color-mix(in srgb, var(--buy) 45%, var(--line)); }
.chip.off { color: var(--sell); border-color: color-mix(in srgb, var(--sell) 45%, var(--line)); }
.spacer { flex: 1; }
.ticker { overflow: hidden; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.track { display: inline-flex; gap: 28px; padding: 7px 0; font: 12px/1 var(--mono); animation: roll 70s linear infinite; }
.track span b { font-weight: 500; color: var(--text); } .track span { color: var(--muted); }
@keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .track { animation: none; } }

.layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr) 410px; } }
.stage { position: relative; min-height: 440px; height: 60vh; background: #070b10; overflow: hidden; }
@media (min-width: 980px) { .stage { height: auto; min-height: 660px; } }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 4px; will-change: transform; }
.tag .name { font: 600 11px/1 var(--body); padding: 3px 7px; border-radius: 6px; background: rgba(8, 12, 18, .8);
             color: var(--text); border: 1px solid rgba(255, 255, 255, .08); white-space: nowrap; }
.tag .name i { font-style: normal; color: var(--muted); font-weight: 400; }
.bubble { max-width: 240px; font: 12px/1.35 var(--body); background: #f4f6f8; color: #111821; padding: 7px 10px;
          border-radius: 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .3s; position: relative; }
.bubble.show { opacity: 1; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent;
                 border-bottom: 0; border-top-color: #f4f6f8; }
.cams { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap;
        right: max(12px, env(safe-area-inset-right, 0px)); }
.cams button, .tabs button, .btn { font: 600 12px/1 var(--body); color: var(--text); background: rgba(17, 25, 34, .92); border: 1px solid var(--line);
                                   border-radius: 8px; padding: 9px 12px; min-height: 36px; cursor: pointer; }
.cams button:hover, .tabs button:hover, .btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.phase { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; font: 600 12px/1.2 var(--mono);
         background: rgba(17, 25, 34, .92); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--accent); max-width: 70%; }
.closed-banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: color-mix(in srgb, var(--sell) 22%, var(--panel));
                 border: 1px solid var(--sell); color: var(--text); border-radius: 10px; padding: 8px 12px; font: 600 12px/1.3 var(--body); text-align: center; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: rgba(7, 11, 16, .72); }
.overlay p { max-width: 420px; margin: 0; color: var(--muted); }
.overlay h2 { font: 600 18px/1.2 var(--display); margin: 0 0 8px; color: var(--text); }

.panel { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
@media (max-width: 979px) { .panel { border-left: 0; border-top: 1px solid var(--line); } }
.tabs { display: flex; gap: 6px; padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px)); overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { background: transparent; flex: none; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #1a1205; border-color: var(--accent); }
.view { padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; display: grid; gap: 14px; align-content: start; }
@media (min-width: 980px) { .view { max-height: calc(100vh - 150px); } }
h3 { font: 600 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--buy); } .neg { color: var(--sell); }
.line { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 10px; }
.line.now { background: var(--panel-2); outline: 1px solid var(--accent); }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--display); color: #0b1016; flex: none; }
.who { font-weight: 600; } .who i { font-style: normal; color: var(--muted); font-weight: 400; font-size: 12px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--panel-2); border-radius: 10px; padding: 10px; min-width: 0; }
.kpi b { display: block; font: 600 18px/1.2 var(--mono); }
.kpi span { font-size: 12px; color: var(--muted); }
.rows { display: grid; gap: 6px; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; }
.row > div { min-width: 0; }
.pill { font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
.card > .pill { display: inline-block; white-space: normal; line-height: 1.35; border-radius: 10px; max-width: 100%; }
.pill.buy { background: color-mix(in srgb, var(--buy) 18%, transparent); color: var(--buy); }
.pill.sell { background: color-mix(in srgb, var(--sell) 18%, transparent); color: var(--sell); }
.pill.hold { background: color-mix(in srgb, var(--hold) 14%, transparent); color: var(--hold); }
.card { background: var(--panel-2); border-radius: 12px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.card .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); }
.note { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin: 0; }
.news a { color: var(--text); text-decoration: none; } .news a:hover { text-decoration: underline; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--hold); margin-right: 6px; }
.dot.up { background: var(--buy); } .dot.down { background: var(--sell); }
.stops { display: flex; gap: 6px; align-items: center; }
.stops i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sell); display: inline-block; }
.stops i.hit { background: var(--sell); }
.sector { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; padding-top: 4px; }
.team { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.member { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; color: var(--text);
          font: inherit; cursor: pointer; display: grid; gap: 4px; min-width: 0; }
.member.sel { border-color: var(--accent); }
.member.away { opacity: .55; }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form input { font: 500 16px/1 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 42px; }
.tog { display: flex; gap: 8px; align-items: center; font-size: 13px; }
svg.spark { width: 100%; height: 70px; display: block; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { font: 600 12px/1 var(--mono); color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; min-height: 34px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #1a1205; border-color: var(--accent); }
.chartwrap { position: relative; width: 100%; height: 0; padding-bottom: 65.8%; }
svg.candles { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); border-radius: 10px; }
svg.candles text { font: 10px var(--mono); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg);
         padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="led off" id="led"></span>Pregao Virtual <small>agencia de trade simulada</small></div>
    <span class="chip" id="deskChip">mesa: -</span>
    <span class="chip" id="climate">clima: -</span>
    <span class="spacer"></span>
    <span class="status" id="status">Conectando ao banco de dados da agencia...</span>
  </header>
  <div class="ticker" aria-label="Indicadores"><div class="track" id="ticker"><span>Carregando indicadores...</span></div></div>
  <main class="layout">
    <section class="stage" aria-label="Escritorio 3D">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <div class="phase" id="phase">Expediente</div>
      <div class="closed-banner" id="closedBanner" hidden></div>
      <div class="cams">
        <button id="camAll">Visao geral</button>
        <button id="camTrade">Trade</button>
        <button id="camResearch">Pesquisa</button>
        <button id="camEco">Economia</button>
        <button id="camMeet">Reuniao</button>
      </div>
      <div class="overlay" id="overlay" hidden><div><h2 id="ovTitle"></h2><p id="ovText"></p></div></div>
    </section>
    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="meeting" aria-selected="true">Reuniao</button>
        <button role="tab" data-tab="broker" aria-selected="false">Corretora</button>
        <button role="tab" data-tab="markets" aria-selected="false">Mercados</button>
        <button role="tab" data-tab="charts" aria-selected="false">Graficos</button>
        <button role="tab" data-tab="research" aria-selected="false">Pesquisa</button>
        <button role="tab" data-tab="team" aria-selected="false">Equipe</button>
        <button role="tab" data-tab="settings" aria-selected="false">Ajustes</button>
      </nav>
      <div class="view" id="view"><p class="muted">Aguardando a primeira leitura do mercado.</p></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ------------------------------------------------------------------ people, sectors and places
const SECTOR = {
  trade: { name: "Setor de Trade", color: "#2dd4bf", floor: "#14302d" },
  pesquisa: { name: "Setor de Pesquisa", color: "#a78bfa", floor: "#241f3a" },
  economia: { name: "Setor de Economia", color: "#60a5fa", floor: "#172a40" },
  lab: { name: "Laboratorio", color: "#f2b544", floor: "#2e2716" },
  direcao: { name: "Diretoria", color: "#f472b6", floor: "#2e1a28" }
};
const COLORS = { helena: "#f472b6", rafa: "#f08a4b", bia: "#e3b94f", duda: "#2dd4bf", marta: "#e5534b", teo: "#7bc96f",
                 lia: "#b77cf0", sofia: "#8b5cf6", kenji: "#39c0c8", otavio: "#5b8def", paulo: "#38bdf8", caio: "#9aabc0", nina: "#4fd1a5" };
const LOOK = { helena: ["#e8c4a0", "#2b1d14", 1], rafa: ["#a8714a", "#1d140e", 0], bia: ["#8a5a3c", "#120c08", 1],
               duda: ["#f1d0b5", "#c46a2c", 1], marta: ["#f0cfb2", "#b7b0a6", 1], teo: ["#6b4630", "#0f0b08", 0],
               lia: ["#f1d0b5", "#7a3e1d", 1], sofia: ["#c99b74", "#24160e", 1], kenji: ["#e9c9a4", "#0d0d10", 0],
               otavio: ["#c68e62", "#3a3a3a", 0], paulo: ["#e2b896", "#5b3b22", 0], caio: ["#e2b896", "#5b3b22", 0], nina: ["#c99b74", "#24160e", 1] };
const DEFAULT_PEOPLE = [
  ["helena", "Helena", "Diretora", "direcao"], ["rafa", "Rafa", "Trader de BTC", "trade"], ["bia", "Bia", "Trader de ouro (XAU)", "trade"],
  ["duda", "Duda", "Trader de forex", "trade"], ["marta", "Marta", "Gestora de risco", "trade"], ["teo", "Teo", "Operador da corretora", "trade"],
  ["lia", "Lia", "Pesquisadora de noticias", "pesquisa"], ["sofia", "Sofia", "Pesquisadora de politica e eventos", "pesquisa"],
  ["kenji", "Kenji", "Estatistico (blocos de 25)", "pesquisa"], ["otavio", "Otavio", "Economista (global)", "economia"],
  ["paulo", "Paulo", "Economista (Brasil)", "economia"], ["caio", "Caio", "Desenvolvedor (laboratorio)", "lab"],
  ["nina", "Nina", "Desenvolvedora (dados)", "lab"]].map(([id, name, role, sector]) => ({ id, name, role, sector }));
// where each person works (standing desks, facing -z)
const STATION = { rafa: [4, -6.2], bia: [7.6, -6.2], duda: [11.2, -6.2], marta: [5.6, -3], teo: [12.6, -3],
                  lia: [-13.4, -6.2], sofia: [-9.8, -6.2], kenji: [-6.2, -6.2],
                  otavio: [-13.6, 3.6], paulo: [-10, 3.6], helena: [14.4, 5.4], caio: [8.4, 3.2], nina: [11.6, 3.2] };
const PARTNER = { rafa: ["marta", "bia"], bia: ["rafa", "duda", "marta"], duda: ["bia", "teo"], marta: ["teo", "rafa", "helena"], teo: ["marta", "duda"],
                  lia: ["sofia", "otavio"], sofia: ["lia", "paulo", "kenji"], kenji: ["sofia", "caio"], otavio: ["paulo", "lia"],
                  paulo: ["otavio", "sofia"], helena: ["marta", "otavio", "kenji"], caio: ["nina", "kenji"], nina: ["caio", "teo"] };
const AISLE = -0.75, EXIT = [17.4, AISLE], MEET = { c: [-0.5, 4.2], r: 2.4, door: [-0.5, 0.6] };
const COFFEE = [-4.5, -3.4];
const MEET_EVERY = 150, LINE_SECONDS = 6.5;

let state = null, people = DEFAULT_PEOPLE, db = null, demoClosed = false;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = (v, d = 2) => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (v, d = 2) => (v >= 0 ? "+" : "") + fmt(v, d);
const usd = v => (v < 0 ? "-US$ " : "US$ ") + fmt(Math.abs(v), 0);
const when = t => new Date(t).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "agora" : m < 60 ? "ha " + m + " min" : "ha " + Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0"); };
const person = id => people.find(p => p.id === id) || DEFAULT_PEOPLE.find(p => p.id === id) || { id, name: id, role: "", sector: "lab" };
const deskClosed = () => demoClosed || !!(state && state.desk && state.desk.today.closed);
const flowWord = f => f > 0 ? "alta" : f < 0 ? "baixa" : "lateral";
function toast(text) { const t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => { t.hidden = true; }, 3800); }

// ------------------------------------------------------------------ data from the agency's database
function showOverlay(title, text) { $("ovTitle").textContent = title; $("ovText").textContent = text; $("overlay").hidden = false; }
async function connect() {
  if (!window.claude || !window.claude.use) {
    showOverlay("Abra pelo link da Claude", "Os dados da agencia ficam no banco desta pagina, que so abre dentro do claude.ai.");
    $("status").textContent = "sem conexao com o banco";
    return;
  }
  db = await window.claude.use("db");
  if (!db) {
    showOverlay("Entre na sua conta", "Para ver a agencia com os dados do mercado, abra este link logado no claude.ai.");
    $("status").textContent = "banco indisponivel nesta visualizacao";
    return;
  }
  db.doc("agency/state").onSnapshot(snap => {
    if (!snap.exists) { showOverlay("Primeiro expediente", "A equipe ainda nao fez a primeira leitura do mercado. Ela aparece aqui sozinha."); return; }
    state = snap.data();
    if (state.people) people = state.people;
    $("overlay").hidden = true;
    applyState();
  }, () => { $("status").textContent = "conexao com o banco perdida; recarregue a pagina"; });
}

function applyState() { renderStatus(); renderTicker(); if (tab !== "settings") renderTab(); paintScreens(); applyDesk(); }

function renderStatus() {
  if (!state) return;
  const fresh = Date.now() - state.updatedAt < 6 * 36e5;
  $("led").className = "led" + (fresh ? "" : " off");
  $("status").textContent = "ultima leitura " + when(state.updatedAt) + " (" + ago(state.updatedAt) + ")" +
    (state.nextAt ? " · proxima ~" + new Date(state.nextAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "");
  const c = state.climate, chip = $("climate");
  chip.textContent = "clima: " + c.label;
  chip.className = "chip" + (c.score >= 2 ? " on" : c.score <= -2 ? " off" : "");
  const d = $("deskChip"), T = state.desk.today;
  d.textContent = deskClosed() ? "mesa fechada" + (demoClosed ? " (simulacao)" : "") : "mesa aberta · stops " + T.stops + "/" + state.config.maxStopsPerDay;
  d.className = "chip " + (deskClosed() ? "off" : "on");
}
setInterval(renderStatus, 30000);

function renderTicker() {
  const t = $("ticker"); t.textContent = "";
  const items = [];
  state.markets.forEach(m => items.push([m.short, fmt(m.price, m.dec), m.chg24h]));
  state.national.concat(state.global).forEach(m => items.push([m.name, fmt(m.price, m.price > 1000 ? 0 : 2), m.chg1d * 100]));
  for (let k = 0; k < 2; k++) items.forEach(([n, v, c]) => {
    const s = el("span"); s.append(n + " "); s.append(el("b", null, v));
    if (c !== null && c !== undefined) s.append(el("span", c >= 0 ? "pos" : "neg", " " + sgn(c) + "%"));
    t.append(s);
  });
}

// ------------------------------------------------------------------ side panel

function spark(points, color) {
  const svgNS = "http://www.w3.org/2000/svg", s = document.createElementNS(svgNS, "svg");
  s.setAttribute("viewBox", "0 0 300 70"); s.setAttribute("preserveAspectRatio", "none"); s.classList.add("spark");
  if (!points || points.length < 2) return s;
  const lo = Math.min(...points), hi = Math.max(...points), span = hi - lo || 1;
  const xy = points.map((p, i) => [i / (points.length - 1) * 298 + 1, 66 - (p - lo) / span * 60]);
  const area = document.createElementNS(svgNS, "path");
  area.setAttribute("d", "M" + xy.map(p => p.join(",")).join("L") + "L299,70L1,70Z");
  area.setAttribute("fill", color); area.setAttribute("fill-opacity", "0.12"); s.append(area);
  const line = document.createElementNS(svgNS, "path");
  line.setAttribute("d", "M" + xy.map(p => p.join(",")).join("L")); line.setAttribute("fill", "none");
  line.setAttribute("stroke", color); line.setAttribute("stroke-width", "2"); line.setAttribute("vector-effect", "non-scaling-stroke");
  s.append(line);
  return s;
}

let chartAsset = "BTC", chartTf = "2m";
function candleSvg(pack, tf) {
  const svgNS = "http://www.w3.org/2000/svg", W = 380, H = 250, pl = 4, pr = 58, pt = 8, pb = 18;
  const s = document.createElementNS(svgNS, "svg"); s.setAttribute("viewBox", "0 0 " + W + " " + H); s.classList.add("candles");
  const cs = pack.tfs[tf] || [];
  if (cs.length < 2) return s;
  const t0 = cs[0][0], t1 = cs[cs.length - 1][0], step = (t1 - t0) / (cs.length - 1) || 1;
  const liq = pack.liquidity || { above: [], below: [], swept: [] };
  let lo = Math.min(...cs.map(c => c[3])), hi = Math.max(...cs.map(c => c[2]));
  const span0 = hi - lo || 1;
  const near = v => v >= lo - span0 * 0.35 && v <= hi + span0 * 0.35;
  const lines = [];
  liq.above.filter(near).forEach(v => lines.push({ v, c: "var(--sell)", t: "liq", dash: "5 3" }));
  liq.below.filter(near).forEach(v => lines.push({ v, c: "var(--buy)", t: "liq", dash: "5 3" }));
  liq.swept.filter(x => x.t >= t0 && near(x.p)).forEach(x => lines.push({ v: x.p, c: "var(--muted)", t: "varrida", dash: "2 3" }));
  const pois = (pack.pois || []).filter(p => p.zone && (p.exitT || t1) >= t0);
  lines.concat(pois.flatMap(p => [{ v: p.zone[0] }, { v: p.zone[1] }])).forEach(x => { lo = Math.min(lo, x.v); hi = Math.max(hi, x.v); });
  const pad = (hi - lo) * 0.04 || 1; lo -= pad; hi += pad;
  const cw = (W - pl - pr) / cs.length, X = t => pl + ((t - t0) / step + 0.5) * cw, Y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
  const add = (tag, attrs, text) => { const e = document.createElementNS(svgNS, tag); Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k])); if (text) e.textContent = text; s.append(e); return e; };
  for (let k = 0; k <= 4; k++) { const y = pt + (H - pt - pb) * k / 4; add("line", { x1: pl, x2: W - pr, y1: y, y2: y, stroke: "var(--line)", "stroke-width": 0.5 });
    add("text", { x: W - pr + 4, y: y + 3 }, fmt(hi - (hi - lo) * k / 4, pack.dec)); }
  // POI zones: from the sweep (or the entry) until the exit or now
  pois.forEach(p => {
    const xa = Math.max(pl, X(Math.max(t0, p.sweepT || p.entryT))), xb = Math.min(W - pr, X(Math.min(t1, p.exitT || t1)) + cw / 2);
    const col = p.dir > 0 ? "var(--buy)" : "var(--sell)";
    add("rect", { x: xa, y: Y(p.zone[1]), width: Math.max(2, xb - xa), height: Math.max(1, Y(p.zone[0]) - Y(p.zone[1])), fill: col, "fill-opacity": p.aligned ? 0.28 : 0.1,
                  stroke: col, "stroke-opacity": p.aligned ? 0.9 : 0.4, "stroke-dasharray": p.aligned ? "" : "3 2" });
    add("text", { x: xa + 2, y: Y(p.zone[1]) - 2 }, "POI " + p.trigger + (p.aligned ? "" : " (fora do macro)") + (p.result ? " · " + p.result : ""));
  });
  lines.forEach(x => { add("line", { x1: pl, x2: W - pr, y1: Y(x.v), y2: Y(x.v), stroke: x.c, "stroke-dasharray": x.dash, "stroke-width": 1 });
    add("text", { x: W - pr + 4, y: Y(x.v) + 3, fill: x.c }, x.t); });
  cs.forEach(c => { const up = c[4] >= c[1], col = up ? "var(--buy)" : "var(--sell)", x = X(c[0]);
    add("line", { x1: x, x2: x, y1: Y(c[2]), y2: Y(c[3]), stroke: col, "stroke-width": 0.8 });
    add("rect", { x: x - cw * 0.35, y: Y(Math.max(c[1], c[4])), width: Math.max(0.8, cw * 0.7), height: Math.max(0.6, Math.abs(Y(c[1]) - Y(c[4]))), fill: col }); });
  [0.1, 0.5, 0.9].forEach(f => { const c = cs[Math.floor(f * (cs.length - 1))];
    add("text", { x: X(c[0]), y: H - 5, "text-anchor": "middle" }, new Date(c[0]).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })); });
  return s;
}

    rowsScreen("bia", "XAU", mdesc(mk("XAU"))); sparkScreen("bia2", "XAU 24h", mk("XAU") && mk("XAU").spark);
    rowsScreen("duda", "FOREX", state.markets.filter(m => m.desk === "duda").map(m => [m.short, m.best ? (m.best.dir > 0 ? "COMPRA" : "VENDA") : flowWord(m.macro ? m.macro.flow : 0)]));

    sparkScreen("teo2", "patrimonio", [cfg.capital].concat(L.curve.map(p => p.eq)));
  }
  rowsScreen("lia", "NOTICIAS", [["lidas", String(state.news.length)], ["positivas", "+" + state.news.filter(n => n.tone > 0).length], ["negativas", "-" + state.news.filter(n => n.tone < 0).length]], "#a78bfa");
  sparkScreen("lia2", "USD/BRL", (nat.find(m => m.id === "BRL=X") || {}).spark);
  const ev = state.research.events[0];
  rowsScreen("sofia", "EVENTOS", ev ? ev.moves.slice(0, 5).map(x => [x.asset, sgn(x.pct) + "%"]) : [["sem eventos", "-"]], "#a78bfa");
  sparkScreen("sofia2", "Ibovespa", (nat.find(m => m.id === "^BVSP") || {}).spark);
  rowsScreen("kenji", "ESTATISTICA", [["trades 60d", String(S.n)], ["acerto", S.winRate + "%"], ["media", sgn(S.expectancy) + "R"], ["dias fechados", String(S.closedDays.length)]], "#a78bfa");
  sparkScreen("kenji2", "1h 2 anos", [cfg.capital].concat(state.desk.study.curve.map(p => p.eq)));
  rowsScreen("otavio", "GLOBAL", glob.slice(0, 5).map(m => [m.name.split(" ")[0], sgn(m.chg1d * 100) + "%"]), "#60a5fa");
  sparkScreen("otavio2", "S&P 500", (glob.find(m => m.id === "^GSPC") || {}).spark);
  rowsScreen("paulo", "BRASIL", nat.map(m => [m.name, sgn(m.chg1d * 100) + "%"]), "#60a5fa");
  sparkScreen("paulo2", "Dolar R$", (nat.find(m => m.id === "BRL=X") || {}).spark);
  rowsScreen("helena", "RANKING", state.research.ranking.slice(0, 5).map(r => [r.asset, fmt(r.score, 1)]), "#f472b6");
  sparkScreen("helena2", "patrimonio", [cfg.capital].concat(L.curve.map(p => p.eq)));
  rowsScreen("caio", "VARIANTES", labRows().map(r => [r[1], sgn(r[2].exp) + "R"]));
  sparkScreen("caio2", "XAU 24h", mk("XAU") && mk("XAU").spark);
  rowsScreen("nina", "DADOS", [["mercados", String(state.markets.length)], ["indicadores", String(glob.length + nat.length)], ["noticias", String(state.news.length)], ["falhas", String(state.errors.length)]]);
  sparkScreen("nina2", "BTC 24h", mk("BTC") && mk("BTC").spark);
}
function paintClock() {
  paint("clock", (c, W, H) => {
    dark(c, W, H, "#05080c");
    c.fillStyle = "#f2b544"; c.font = "500 54px 'IBM Plex Mono', monospace";
    c.fillText(new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" }), 20, 70);
    c.fillStyle = "#8b9cae"; c.font = "18px 'IBM Plex Mono', monospace"; c.fillText("BRASILIA · 24/7", 22, 104);
  });
}
function paintSigns() { sign("trade", 9.4, -1.6, 4.4); sign("pesquisa", -9.4, -1.6, 5); sign("economia", -11.8, 7.8, 5); sign("lab", 9.1, 7.8, 3.8); sign("direcao", 15.2, 7.8, 3.2); }
paintClock(); setInterval(paintClock, 20000); paintSigns();

// ------------------------------------------------------------------ the agents
const labels = $("labels");
function makeBody(id) {
  const [skin, hair, fem] = LOOK[id] || ["#d9b08c", "#222", 0];
  const shirt = mat(COLORS[id] || "#888"), pants = mat("#2b3440"), skinM = mat(skin), hairM = mat(hair);
  const g = new THREE.Group();
  const legL = box(0.17, 0.8, 0.2, pants, -0.11, 0.4, 0, g), legR = box(0.17, 0.8, 0.2, pants, 0.11, 0.4, 0, g);
  [legL, legR].forEach(l => { l.geometry.translate(0, -0.4, 0); l.position.y = 0.8; });
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.42, 4, 10), shirt);
  torso.position.y = 1.18; torso.scale.z = 0.62; torso.castShadow = true; g.add(torso);
  const mkArm = sx => { const a = box(0.11, 0.62, 0.12, shirt, sx, 1.42, 0, g); a.geometry.translate(0, -0.3, 0); return a; };
  const armL = mkArm(-0.33), armR = mkArm(0.33);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 18, 14), skinM); head.position.y = 1.74; head.castShadow = true; g.add(head);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.2, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), hairM);
  cap.position.y = 1.76; cap.rotation.x = -0.25; g.add(cap);
  if (fem) box(0.22, 0.32, 0.1, hairM, 0, 1.62, 0.14, g);
  g.traverse(o => { o.userData.agent = id; });
  return { g, legL, legR, armL, armR, head };
}
const agents = [];
DEFAULT_PEOPLE.forEach(p => {
  const b = makeBody(p.id), home = STATION[p.id];
  b.g.position.set(home[0], 0, home[1]); scene.add(b.g);
  const tag = el("div", "tag"), bub = el("div", "bubble"), nm = el("div", "name", p.name + " ");
  nm.append(el("i", null, p.role.split(" ")[0])); tag.append(bub, nm); labels.append(tag);
  agents.push({ id: p.id, sector: p.sector, body: b, tag, bub, path: [], mode: "work", timer: 3 + Math.random() * 8, face: Math.PI,
                speed: 1.6 + Math.random() * 0.3, doing: "Trabalhando na mesa", bubbleUntil: 0, phase: Math.random() * 6, away: false });
});
const clock = new THREE.Clock();
function say(a, text, secs) { if (!text || a.away) return; a.bub.textContent = text; a.bub.classList.add("show"); a.bubbleUntil = clock.elapsedTime + (secs || 5); }
const inMeet = (x, z) => x > -4.6 && x < 3.6 && z > 0.05;
function route(a, to, after) {
  const p = a.body.g.position, pts = [];
  if (inMeet(p.x, p.z)) pts.push(MEET.door);
  else if (Math.abs(p.z - AISLE) > 0.3) pts.push([p.x, AISLE]);
  const goingIn = inMeet(to[0], to[1]);
  const tx = goingIn ? MEET.door[0] : to[0];
  pts.push([tx, AISLE]);
  if (goingIn) pts.push(MEET.door);
  pts.push(to);
  a.path = pts.map(q => new THREE.Vector2(q[0], q[1])); a.after = after; a.mode = "walk";
}
const taskOf = id => (state && state.agents && state.agents[id] && state.agents[id].task) || "Trabalhando na mesa";
const bubbleOf = id => (state && state.agents && state.agents[id] && state.agents[id].bubble) || "";
function goHome(a) {
  if (a.sector === "trade" && deskClosed()) return leave(a);
  a.doing = "Voltando para a mesa";
  route(a, STATION[a.id], () => { a.mode = "work"; a.face = Math.PI; a.timer = 8 + Math.random() * 14; a.doing = taskOf(a.id); });
}
function leave(a) {
  if (a.away || a.leaving) return;
  a.leaving = true; a.doing = "Indo para casa: 2 stops no dia";
  say(a, "Dois stops hoje. Volto na proxima abertura.", 4);
  route(a, EXIT, () => { a.away = true; a.leaving = false; a.body.g.visible = false; a.tag.style.display = "none"; a.mode = "away"; a.doing = "Foi para casa (2 stops no dia)"; });
}
function comeBack(a) {
  if (!a.away) return;
  a.away = false; a.body.g.visible = true; a.body.g.position.set(EXIT[0], 0, EXIT[1]);
  goHome(a); say(a, "Nova sessao, mesa aberta.", 4);
}
let lastClosed = null;
function applyDesk() {
  const closed = deskClosed();
  if (closed === lastClosed) return;
  lastClosed = closed;
  agents.filter(a => a.sector === "trade").forEach(a => closed ? leave(a) : comeBack(a));
  sectorLights.trade.forEach(l => { if (l.isLight) l.intensity = closed ? 0 : 0.9; else l.material.color.set(closed ? "#333" : "#fff1cf"); });
  sectorFloors.trade.color.set(closed ? "#0c1413" : SECTOR.trade.floor);
  const ban = $("closedBanner");
  ban.hidden = !closed;
  if (closed) ban.textContent = demoClosed ? "Simulacao visual: assim fica a agencia depois de 2 stops no dia. A pesquisa segue." :
    "Mesa de trade fechada: " + state.desk.today.stops + " stops hoje. Volta na proxima abertura (00:00 UTC). A pesquisa segue.";
  paintScreens(); if (tab === "meeting" || tab === "team" || tab === "broker") renderTab(); renderStatus();
}
function decide(a) {
  if (meeting.phase !== "off" || a.away) return;
  const r = Math.random();
  if (r < 0.55) { a.timer = 8 + Math.random() * 14; a.doing = taskOf(a.id); if (Math.random() < 0.6) say(a, bubbleOf(a.id), 6); return; }
  if (r < 0.85) {
    const opts = PARTNER[a.id].map(id => agents.find(x => x.id === id)).filter(x => x && x.mode === "work" && !x.away);
    if (!opts.length) { a.timer = 5; return; }
    const partner = opts[Math.floor(Math.random() * opts.length)], pp = partner.body.g.position;
    a.doing = "Conversando com " + person(partner.id).name;
    route(a, [pp.x + 0.9, pp.z + 0.6], () => {
      a.mode = "talk"; a.timer = 7; a.face = Math.atan2(pp.x - a.body.g.position.x, pp.z - a.body.g.position.z);
      say(a, bubbleOf(a.id), 3.5); setTimeout(() => say(partner, bubbleOf(partner.id), 3.5), 3500);
      a.onDone = () => goHome(a);
    });
    return;
  }
  a.doing = "Pausa para o cafe";
  route(a, [COFFEE[0] - 0.8 + Math.random() * 1.6, COFFEE[1]], () => { a.mode = "talk"; a.timer = 5 + Math.random() * 4; a.face = Math.PI; a.onDone = () => goHome(a); });
}

// meetings: who is in the office walks to the glass room and the latest minutes are read out
const meeting = { phase: "off", next: 18, line: 0, lineAt: 0, startedAt: 0, list: [] };
function startMeeting(t) {
  if (!state) { meeting.next = t + 20; return; }
  const present = agents.filter(a => !a.away && !a.leaving);
  meeting.phase = "gather"; meeting.startedAt = t; meeting.list = lines();
  $("phase").textContent = deskClosed() ? "Reuniao de estudo: pesquisa, economia e diretoria" : "Reuniao: equipe a caminho da sala";
  present.forEach((a, i) => {
    const ang = i / present.length * Math.PI * 2, s = [MEET.c[0] + Math.cos(ang) * MEET.r, MEET.c[1] + Math.sin(ang) * MEET.r];
    a.doing = "Indo para a reuniao";
    route(a, s, () => { a.mode = "meet"; a.face = Math.atan2(MEET.c[0] - s[0], MEET.c[1] - s[1]); a.doing = "Em reuniao"; });
  });
}
function tickMeeting(t) {
  if (meeting.phase === "off") { if (t > meeting.next) startMeeting(t); return; }
  if (meeting.phase === "gather") {
    if (agents.every(a => a.away || a.mode === "meet") || t - meeting.startedAt > 30) { meeting.phase = "talk"; meeting.line = -1; meeting.lineAt = t - LINE_SECONDS; }
    return;
  }
  if (t - meeting.lineAt < LINE_SECONDS) return;
  meeting.line++; meeting.lineAt = t;
  const L = meeting.list;
  if (meeting.line >= L.length) {
    meeting.phase = "off"; meeting.next = t + MEET_EVERY; speaking = -1; $("phase").textContent = "Expediente";
    agents.forEach(a => { if (!a.away) goHome(a); }); if (tab === "meeting") renderTab(); return;
  }
  const l = L[meeting.line], a = agents.find(x => x.id === l.who);
  speaking = meeting.line;
  if (a) say(a, l.text.length > 170 ? l.text.slice(0, 167) + "..." : l.text, LINE_SECONDS - 0.4);
  $("phase").textContent = "Reuniao: " + person(l.who).name + " falando";
  if (tab === "meeting") {
    document.querySelectorAll(".line.now").forEach(x => x.classList.remove("now"));
    const row = $("line" + meeting.line); if (row) { row.classList.add("now"); row.scrollIntoView({ block: "nearest", behavior: calm ? "auto" : "smooth" }); }
  }
}

function animateAgent(a, dt, t) {
  if (a.away) return;
  const g = a.body.g, p = g.position;
  if (a.mode === "walk") {
    const target = a.path[0];
    if (!target) { a.mode = "idle"; if (a.after) { const f = a.after; a.after = null; f(); } }
    else {
      const dx = target.x - p.x, dz = target.y - p.z, d = Math.hypot(dx, dz);
      if (d < 0.08) a.path.shift();
      else { const s = Math.min(d, a.speed * dt); p.x += dx / d * s; p.z += dz / d * s; a.face = Math.atan2(dx, dz); }
    }
    const sw = Math.sin(t * 9 + a.phase) * 0.55;
    a.body.legL.rotation.x = sw; a.body.legR.rotation.x = -sw; a.body.armL.rotation.x = -sw * 0.8; a.body.armR.rotation.x = sw * 0.8;
    g.position.y = Math.abs(Math.sin(t * 9 + a.phase)) * 0.04;
  } else {
    a.body.legL.rotation.x *= 0.8; a.body.legR.rotation.x *= 0.8; g.position.y = 0;
    if (a.mode === "work") {
      const k = Math.sin(t * 14 + a.phase) * 0.08;
      a.body.armL.rotation.x = -1.05 + k; a.body.armR.rotation.x = -1.05 - k;
      a.body.head.rotation.y = Math.sin(t * 0.7 + a.phase) * 0.25;
    } else {
      a.body.armL.rotation.x = Math.sin(t * 2 + a.phase) * 0.15;
      a.body.armR.rotation.x = a.bub.classList.contains("show") ? -0.6 + Math.sin(t * 5) * 0.3 : 0;
      a.body.head.rotation.y = 0;
    }
    if (a.mode === "work" || a.mode === "talk") {
      a.timer -= dt;
      if (a.timer <= 0) { if (a.mode === "talk" && a.onDone) { const f = a.onDone; a.onDone = null; f(); } else decide(a); }
    }
  }
  let diff = a.face - g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); g.rotation.y += diff * Math.min(1, dt * 8);
  if (a.bubbleUntil && t > a.bubbleUntil) { a.bub.classList.remove("show"); a.bubbleUntil = 0; }
}

const v3 = new THREE.Vector3();
function placeLabels(w, h) {
  agents.forEach(a => {
    if (a.away) return;
    v3.set(a.body.g.position.x, 2.12, a.body.g.position.z).project(camera);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
    a.tag.style.display = vis ? "" : "none";
    if (vis) a.tag.style.transform = "translate(" + ((v3.x + 1) / 2 * w) + "px," + ((1 - v3.y) / 2 * h) + "px) translate(-50%,-100%)";
  });
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let downAt = null;
canvas.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = canvas.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(agents.filter(a => !a.away).map(a => a.body.g), true).find(h => h.object.userData.agent);
  if (hit) focusAgent(hit.object.userData.agent);
});
function focusAgent(id) {
  selected = id; setTab("team");
  const a = agents.find(x => x.id === id); if (!a || a.away) return;
  const p = a.body.g.position; flyTo([p.x + 4, 4.5, p.z + 6], [p.x, 1.2, p.z]);
  say(a, bubbleOf(id), 6);
}
let fly = null;
function flyTo(pos, target) { fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...pos), t1: new THREE.Vector3(...target), k: 0 }; }
$("camAll").onclick = () => flyTo([4, 21, 25], [0, 0.5, -1.5]);
$("camTrade").onclick = () => flyTo([9, 7, 4], [9, 1.2, -6]);
$("camResearch").onclick = () => flyTo([-9.5, 7, 4], [-9.5, 1.2, -6]);
$("camEco").onclick = () => flyTo([-10, 6.5, 13], [-11, 1, 3]);
$("camMeet").onclick = () => flyTo([-0.5, 8, 13], [-0.5, 0.8, 4]);

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (fly) {
    fly.k = Math.min(1, fly.k + dt / 1.2); const e = fly.k < 0.5 ? 2 * fly.k * fly.k : 1 - Math.pow(-2 * fly.k + 2, 2) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (fly.k >= 1) fly = null;
  }
  tickMeeting(t);
  agents.forEach(a => animateAgent(a, dt, t));
  controls.update();
  renderer.render(scene, camera);
  const r = canvas.getBoundingClientRect(); placeLabels(r.width, r.height);
  requestAnimationFrame(frame);
}
frame();
connect();
if (document.fonts) document.fonts.ready.then(() => { paintScreens(); paintClock(); paintSigns(); });
