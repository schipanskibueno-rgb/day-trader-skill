<title>Pregao Virtual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a trading floor at night. The 3D office takes the stage; a dark side panel reads like a terminal. */
:root {
  --bg: #0b1016; --panel: #111922; --panel-2: #17212c; --line: #223040; --text: #e4ebf2; --muted: #8b9cae;
  --accent: #f2b544; --buy: #3fd08f; --sell: #ff6b6b; --hold: #9db0c4; --info: #6cb6ff;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { min-height: 100%; display: flex; flex-direction: column; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; flex-wrap: wrap; align-items: center;
       gap: 6px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px));
       padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font: 700 18px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.brand .led { width: 10px; height: 10px; border-radius: 50%; background: var(--buy); box-shadow: 0 0 10px var(--buy); }
.brand .led.off { background: var(--muted); box-shadow: none; }
.brand small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: 0; text-transform: none; }
.status { color: var(--muted); font: 12px/1.3 var(--mono); }
.chip { font: 600 12px/1 var(--mono); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--hold); }
.chip.on { color: var(--buy); border-color: color-mix(in srgb, var(--buy) 45%, var(--line)); }
.chip.off { color: var(--sell); border-color: color-mix(in srgb, var(--sell) 45%, var(--line)); }
.spacer { flex: 1; }
.ticker { overflow: hidden; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.track { display: inline-flex; gap: 28px; padding: 7px 0; font: 12px/1 var(--mono); animation: roll 60s linear infinite; }
.track span b { font-weight: 500; color: var(--text); } .track span { color: var(--muted); }
@keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .track { animation: none; } }

.layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr) 400px; } }
.stage { position: relative; min-height: 420px; height: 58vh; background: #070b10; overflow: hidden; }
@media (min-width: 980px) { .stage { height: auto; min-height: 640px; } }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 4px; }
.tag .name { font: 600 11px/1 var(--body); padding: 3px 7px; border-radius: 6px; background: rgba(8, 12, 18, .78);
             color: var(--text); border: 1px solid rgba(255, 255, 255, .08); white-space: nowrap; }
.tag .name i { font-style: normal; color: var(--muted); font-weight: 400; }
.bubble { max-width: 230px; font: 12px/1.35 var(--body); background: #f4f6f8; color: #111821; padding: 7px 10px;
          border-radius: 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .3s; position: relative; }
.bubble.show { opacity: 1; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent;
                 border-bottom: 0; border-top-color: #f4f6f8; }
.cams { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.cams button, .tabs button { font: 600 12px/1 var(--body); color: var(--text); background: rgba(17, 25, 34, .9); border: 1px solid var(--line);
                             border-radius: 8px; padding: 9px 12px; min-height: 36px; cursor: pointer; }
.cams button:hover, .tabs button:hover { border-color: var(--accent); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.phase { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; font: 600 12px/1 var(--mono);
         background: rgba(17, 25, 34, .9); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--accent); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: rgba(7, 11, 16, .72); }
.overlay p { max-width: 420px; margin: 0; color: var(--muted); }
.overlay h2 { font: 600 18px/1.2 var(--display); margin: 0 0 8px; color: var(--text); }

.panel { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
@media (max-width: 979px) { .panel { border-left: 0; border-top: 1px solid var(--line); } }
.tabs { display: flex; gap: 6px; padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px)); overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { background: transparent; flex: none; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #1a1205; border-color: var(--accent); }
.view { padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; display: grid; gap: 14px; align-content: start; }
@media (min-width: 980px) { .view { max-height: calc(100vh - 150px); } }
h3 { font: 600 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--buy); } .neg { color: var(--sell); }

.line { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 10px; }
.line.now { background: var(--panel-2); outline: 1px solid var(--accent); }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--display); color: #0b1016; }
.who { font-weight: 600; } .who i { font-style: normal; color: var(--muted); font-weight: 400; font-size: 12px; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--panel-2); border-radius: 10px; padding: 10px; }
.kpi b { display: block; font: 600 18px/1.2 var(--mono); }
.kpi span { font-size: 12px; color: var(--muted); }
.rows { display: grid; gap: 6px; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; }
.row > div { min-width: 0; }
.pill { font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
.pill.buy { background: color-mix(in srgb, var(--buy) 18%, transparent); color: var(--buy); }
.pill.sell { background: color-mix(in srgb, var(--sell) 18%, transparent); color: var(--sell); }
.pill.hold { background: color-mix(in srgb, var(--hold) 14%, transparent); color: var(--hold); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 500 11px/1 var(--body); color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; }
.news a { color: var(--text); text-decoration: none; } .news a:hover { text-decoration: underline; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--hold); margin-right: 6px; }
.dot.up { background: var(--buy); } .dot.down { background: var(--sell); }
.card { background: var(--panel-2); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.team { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.member { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; color: var(--text);
          font: inherit; cursor: pointer; display: grid; gap: 4px; }
.member.sel { border-color: var(--accent); }
.note { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
svg.spark { width: 100%; height: 70px; display: block; }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="led off" id="led"></span>Pregao Virtual <small>agencia de operacoes simulada</small></div>
    <span class="chip" id="climate">clima: -</span>
    <span class="spacer"></span>
    <span class="status" id="status">Conectando ao banco de dados da agencia...</span>
  </header>
  <div class="ticker" aria-label="Indicadores"><div class="track" id="ticker"><span>Carregando indicadores...</span></div></div>
  <main class="layout">
    <section class="stage" aria-label="Escritorio 3D">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <div class="phase" id="phase">Expediente</div>
      <div class="cams">
        <button id="camAll">Visao geral</button>
        <button id="camDesk">Mesa de operacoes</button>
        <button id="camMeet">Sala de reuniao</button>
      </div>
      <div class="overlay" id="overlay" hidden><div><h2 id="ovTitle"></h2><p id="ovText"></p></div></div>
    </section>
    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="meeting" aria-selected="true">Reuniao</button>
        <button role="tab" data-tab="broker" aria-selected="false">Corretora</button>
        <button role="tab" data-tab="market" aria-selected="false">Mercado</button>
        <button role="tab" data-tab="news" aria-selected="false">Noticias</button>
        <button role="tab" data-tab="team" aria-selected="false">Equipe</button>
      </nav>
      <div class="view" id="view"><p class="muted">Aguardando a primeira leitura do mercado.</p></div>
    </aside>
  </main>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ------------------------------------------------------------------ people and places
const COLORS = { helena: "#e3b94f", otavio: "#5b8def", lia: "#b77cf0", rafa: "#f08a4b", bia: "#ef5f8b",
                 kenji: "#39c0c8", marta: "#e5534b", teo: "#7bc96f", caio: "#9aabc0", nina: "#4fd1a5" };
const LOOK = { helena: ["#e8c4a0", "#2b1d14", 1], otavio: ["#c68e62", "#3a3a3a", 0], lia: ["#f1d0b5", "#7a3e1d", 1],
               rafa: ["#a8714a", "#1d140e", 0], bia: ["#8a5a3c", "#120c08", 1], kenji: ["#e9c9a4", "#0d0d10", 0],
               marta: ["#f0cfb2", "#b7b0a6", 1], teo: ["#6b4630", "#0f0b08", 0], caio: ["#e2b896", "#5b3b22", 0],
               nina: ["#c99b74", "#24160e", 1] };
const DEFAULT_PEOPLE = [
  ["helena", "Helena", "Diretora"], ["otavio", "Otavio", "Economista"], ["lia", "Lia", "Pesquisadora de noticias"],
  ["rafa", "Rafa", "Trader de cripto"], ["bia", "Bia", "Trader de bolsa"], ["kenji", "Kenji", "Analista quantitativo"],
  ["marta", "Marta", "Gestora de risco"], ["teo", "Teo", "Operador da corretora"], ["caio", "Caio", "Desenvolvedor (laboratorio)"],
  ["nina", "Nina", "Desenvolvedora (dados)"]].map(([id, name, role]) => ({ id, name, role }));
// where each person works (they stand at their desk, facing -z)
const STATION = { rafa: [-4.5, -4.1], bia: [-1.5, -4.1], kenji: [1.5, -4.1], marta: [4.5, -4.1],
                  otavio: [-4.5, -0.1], lia: [-1.5, -0.1], caio: [1.5, -0.1], nina: [4.5, -0.1],
                  helena: [11, -5.1], teo: [11, 1.9] };
const PARTNER = { rafa: ["kenji", "marta", "bia"], bia: ["rafa", "marta", "otavio"], kenji: ["rafa", "caio", "marta"],
                  marta: ["teo", "rafa", "helena"], otavio: ["lia", "helena", "bia"], lia: ["otavio", "rafa"],
                  caio: ["nina", "kenji"], nina: ["caio", "teo"], helena: ["marta", "otavio", "kenji"], teo: ["marta", "nina"] };
const MEET = { c: [-11, -3], r: 2.55, door: [-6.2, -3], inside: [-8.6, -3] };
const COFFEE = [-1.5, 5.6], BOARD = [11.3, 5.4];
const MEET_EVERY = 150, LINE_SECONDS = 6.5;

let state = null, people = DEFAULT_PEOPLE;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = (v, d = 2) => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (v, d = 2) => (v >= 0 ? "+" : "") + fmt(v, d);
const money = (v, cur = "US$") => cur + " " + fmt(v, v >= 100 ? 0 : v >= 1 ? 2 : 4);
const when = t => new Date(t).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "agora" : m < 60 ? "ha " + m + " min" : "ha " + Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0"); };
const pillOf = v => v.indexOf("COMPRA") === 0 ? "buy" : v.indexOf("VENDA") === 0 ? "sell" : "hold";
const person = id => people.find(p => p.id === id) || { id, name: id, role: "" };

// ------------------------------------------------------------------ data from the agency's database
function showOverlay(title, text) { $("ovTitle").textContent = title; $("ovText").textContent = text; $("overlay").hidden = false; }
async function connect() {
  if (!window.claude || !window.claude.use) {
    showOverlay("Abra pelo link da Claude", "Os dados da agencia ficam no banco desta pagina, que so abre dentro do claude.ai.");
    $("status").textContent = "sem conexao com o banco";
    return;
  }
  const db = await window.claude.use("db");
  if (!db) {
    showOverlay("Entre na sua conta", "Para ver a agencia com os dados do mercado, abra este link logado no claude.ai.");
    $("status").textContent = "banco indisponivel nesta visualizacao";
    return;
  }
  db.doc("agency/state").onSnapshot(snap => {
    if (!snap.exists) { showOverlay("Primeiro expediente", "A equipe ainda nao fez a primeira leitura do mercado. Ela aparece aqui sozinha."); return; }
    state = snap.data();
    if (state.people) people = state.people;
    $("overlay").hidden = true;
    applyState();
  }, () => { $("status").textContent = "conexao com o banco perdida; recarregue a pagina"; });
}

function applyState() {
  renderStatus(); renderTicker(); renderTab(); paintScreens();
}

function renderStatus() {
  if (!state) return;
  const fresh = Date.now() - state.updatedAt < 6 * 36e5;
  $("led").className = "led" + (fresh ? "" : " off");
  $("status").textContent = "ultima leitura " + when(state.updatedAt) + " (" + ago(state.updatedAt) + ")" +
    (state.nextAt ? " · proxima ~" + new Date(state.nextAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "");
  const c = state.climate, chip = $("climate");
  chip.textContent = "clima: " + c.label;
  chip.className = "chip" + (c.score >= 2 ? " on" : c.score <= -2 ? " off" : "");
}
setInterval(renderStatus, 30000);

function renderTicker() {
  const t = $("ticker"); t.textContent = "";
  const items = [];
  state.assets.forEach(a => items.push([a.short, money(a.price, a.cur), a.chg1d]));
  state.macro.forEach(m => items.push([m.name, fmt(m.price, m.price > 1000 ? 0 : 2), m.chg1d * 100]));
  if (state.fng) items.push(["Medo e ganancia", String(state.fng.value), null]);
  for (let k = 0; k < 2; k++) items.forEach(([n, v, c]) => {
    const s = el("span"); s.append(n + " "); s.append(el("b", null, v));
    if (c !== null) s.append(el("span", c >= 0 ? "pos" : "neg", " " + sgn(c) + "%"));
    t.append(s);
  });
}

// ------------------------------------------------------------------ side panel
let tab = "meeting", selected = null, speaking = -1;
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
function setTab(name) {
  tab = name;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  renderTab();
}
function renderTab() {
  const v = $("view"); v.textContent = "";
  if (!state) { v.append(el("p", "muted", "Aguardando a primeira leitura do mercado.")); return; }
  ({ meeting: viewMeeting, broker: viewBroker, market: viewMarket, news: viewNews, team: viewTeam })[tab](v);
}
function avatar(id) { const a = el("div", "av", person(id).name[0]); a.style.background = COLORS[id] || "#888"; return a; }

function viewMeeting(v) {
  v.append(el("h3", null, "Ata da reuniao · " + when(state.meeting.time)));
  v.append(el("p", "note", "Cada fala vem dos dados desta leitura. A reuniao e encenada no escritorio a cada " +
    Math.round(MEET_EVERY / 60 * 10) / 10 + " minutos com a ata mais recente."));
  state.meeting.lines.forEach((l, i) => {
    const row = el("div", "line" + (i === speaking ? " now" : "")); row.id = "line" + i;
    row.append(avatar(l.who));
    const body = el("div"); const who = el("div", "who", person(l.who).name + " ");
    who.append(el("i", null, person(l.who).role)); body.append(who, el("div", null, l.text)); row.append(body);
    v.append(row);
  });
}

function spark(points, color) {
  const svgNS = "http://www.w3.org/2000/svg", s = document.createElementNS(svgNS, "svg");
  s.setAttribute("viewBox", "0 0 300 70"); s.setAttribute("preserveAspectRatio", "none"); s.classList.add("spark");
  if (points.length < 2) return s;
  const lo = Math.min(...points), hi = Math.max(...points), span = hi - lo || 1;
  const xy = points.map((p, i) => [i / (points.length - 1) * 298 + 1, 66 - (p - lo) / span * 60]);
  const area = document.createElementNS(svgNS, "path");
  area.setAttribute("d", "M" + xy.map(p => p.join(",")).join("L") + "L299,70L1,70Z");
  area.setAttribute("fill", color); area.setAttribute("fill-opacity", "0.12"); s.append(area);
  const line = document.createElementNS(svgNS, "path");
  line.setAttribute("d", "M" + xy.map(p => p.join(",")).join("L")); line.setAttribute("fill", "none");
  line.setAttribute("stroke", color); line.setAttribute("stroke-width", "2"); line.setAttribute("vector-effect", "non-scaling-stroke");
  s.append(line);
  const end = document.createElementNS(svgNS, "circle"); const last = xy[xy.length - 1];
  end.setAttribute("cx", last[0]); end.setAttribute("cy", last[1]); end.setAttribute("r", "3"); end.setAttribute("fill", color);
  s.append(end);
  return s;
}

function kpi(label, value, cls) { const k = el("div", "kpi"); k.append(el("b", "num " + (cls || ""), value), el("span", null, label)); return k; }

function tradeRow(t, cur) {
  const r = el("div", "row");
  const left = el("div");
  left.append(el("div", null, (t.dir > 0 ? "Compra " : "Venda ") + t.asset));
  left.append(el("div", "small muted", "entrada " + money(t.entry || t.ref, cur) + " · stop " + money(t.stop, cur) + " · alvo " + money(t.take, cur)));
  r.append(left);
  if (t.r !== undefined && t.r !== null) r.append(el("b", "num " + (t.r > 0 ? "pos" : "neg"), sgn(t.r) + "R"));
  else if (t.openR !== undefined && t.openR !== null) r.append(el("b", "num " + (t.openR >= 0 ? "pos" : "neg"), sgn(t.openR) + "R aberto"));
  else r.append(el("span", "pill hold", "na proxima abertura"));
  return r;
}

function viewBroker(v) {
  const L = state.broker.live, S = state.broker.sim;
  v.append(el("h3", null, "Corretora virtual · desde " + state.founded.split("-").reverse().join("/")));
  const k = el("div", "kpis");
  k.append(kpi("patrimonio (US$ virtuais)", fmt(L.equity, 0)), kpi("retorno", sgn(L.ret) + "%", L.ret >= 0 ? "pos" : "neg"),
           kpi("posicoes abertas", String(L.open.length)), kpi("operacoes encerradas", String(L.n)));
  v.append(k);
  v.append(el("p", "note", "Dinheiro de mentira, precos de verdade. Cada operacao arrisca 1% do patrimonio, com o stop e o alvo do robo. Nada vai para uma corretora real."));
  const pend = L.pending || [];
  v.append(el("h3", null, "Ordens para a proxima abertura"));
  const pr = el("div", "rows");
  if (!pend.length) pr.append(el("p", "muted small", "Nenhuma. A gestora de risco nao aprovou sinal nesta leitura."));

  scene.add(b.g);
  const tag = el("div", "tag"); const bub = el("div", "bubble"); const nm = el("div", "name", p.name + " ");
  nm.append(el("i", null, p.role.split(" ")[0])); tag.append(bub, nm); labels.append(tag);
  const a = { id: p.id, body: b, tag, bub, path: [], mode: "work", timer: 3 + Math.random() * 8, face: Math.PI, speed: 1.5 + Math.random() * 0.3,
              doing: "Trabalhando na mesa", bubbleUntil: 0, phase: Math.random() * 6 };
  agents.push(a);
}
DEFAULT_PEOPLE.forEach(addAgent);

function say(a, text, secs) { a.bub.textContent = text; a.bub.classList.add("show"); a.bubbleUntil = clock.elapsedTime + (secs || 5); }
const aisle = z => (z < -2 ? -2.3 : 2.6);
function route(a, to, after) {
  const p = a.body.g.position, pts = [];
  const inMeet = (x, z) => x < -7 && z < 1 && z > -7;
  const from = [p.x, p.z];
  if (inMeet(from[0], from[1])) { pts.push(MEET.inside, MEET.door); from[0] = MEET.door[0]; from[1] = MEET.door[1]; }
  const goingIn = inMeet(to[0], to[1]);
  const target = goingIn ? MEET.door : to;
  const za = aisle(from[1]), zb = aisle(target[1]);
  pts.push([from[0], za]);
  if (za !== zb) pts.push([from[0] > 8 ? 8 : from[0] < -6 ? -6 : from[0], zb]);
  pts.push([target[0], zb], target);
  if (goingIn) pts.push(MEET.inside, to);
  a.path = pts.map(q => new THREE.Vector2(q[0], q[1])); a.after = after; a.mode = "walk";
}
function goHome(a) {
  const h = STATION[a.id];
  a.doing = "Voltando para a mesa";
  route(a, h, () => { a.mode = "work"; a.face = Math.PI; a.timer = 8 + Math.random() * 14; a.doing = taskOf(a.id); });
}
const taskOf = id => (state && state.agents && state.agents[id] && state.agents[id].task) || "Trabalhando na mesa";
const bubbleOf = id => (state && state.agents && state.agents[id] && state.agents[id].bubble) || "";

function decide(a) {
  if (meeting.phase !== "off") return;
  const r = Math.random();
  if (r < 0.55) { a.timer = 8 + Math.random() * 14; a.doing = taskOf(a.id); if (Math.random() < 0.6 && bubbleOf(a.id)) say(a, bubbleOf(a.id), 6); return; }
  if (r < 0.82) {
    const pid = PARTNER[a.id][Math.floor(Math.random() * PARTNER[a.id].length)], partner = agents.find(x => x.id === pid);
    if (!partner || partner.mode !== "work") { a.timer = 5; return; }
    const pp = partner.body.g.position, spot = [pp.x + 0.9, pp.z + 0.6];
    a.doing = "Conversando com " + person(pid).name;
    route(a, spot, () => {
      a.mode = "talk"; a.timer = 7; a.face = Math.atan2(pp.x - a.body.g.position.x, pp.z - a.body.g.position.z);
      const mine = bubbleOf(a.id), theirs = bubbleOf(pid);
      if (mine) say(a, mine, 3.5);
      if (theirs) setTimeout(() => say(partner, theirs, 3.5), 3500);
      a.onDone = () => goHome(a);
    });
    return;
  }
  const dev = a.id === "caio" || a.id === "nina" || a.id === "kenji";
  const spot = dev ? [BOARD[0] - 1.2 + Math.random() * 0.4, BOARD[1] + 0.6] : [COFFEE[0] - 0.6 + Math.random() * 1.6, COFFEE[1]];
  a.doing = dev ? "Anotando resultados no quadro do laboratorio" : "Pausa para o cafe";
  route(a, spot, () => {
    a.mode = "talk"; a.timer = 6 + Math.random() * 4; a.face = dev ? -0.55 + Math.PI : 0;
    if (dev && state && state.lab && state.lab[0]) { const best = state.lab[0].rows.slice().sort((x, y) => y.exp - x.exp)[0]; say(a, "Melhor variante BTC: stop " + best.stopAtr + " ATR, alvo " + best.rr + "R: " + sgn(best.exp) + "R", 5); }
    a.onDone = () => goHome(a);
  });
}

// meetings: everyone walks to the glass room and the latest minutes are read out
const meeting = { phase: "off", next: 20, line: 0, lineAt: 0, startedAt: 0 };
function seatOf(i, n) { const ang = i / n * Math.PI * 2; return [MEET.c[0] + Math.cos(ang) * MEET.r, MEET.c[1] + Math.sin(ang) * MEET.r]; }
function startMeeting(t) {
  if (!state) { meeting.next = t + 20; return; }
  meeting.phase = "gather"; meeting.startedAt = t; $("phase").textContent = "Reuniao: equipe a caminho da sala";
  agents.forEach((a, i) => {
    a.doing = "Indo para a reuniao"; const s = seatOf(i, agents.length);
    route(a, s, () => { a.mode = "meet"; a.face = Math.atan2(MEET.c[0] - s[0], MEET.c[1] - s[1]); a.doing = "Em reuniao"; });
  });
}
function tickMeeting(t) {
  if (meeting.phase === "off") { if (t > meeting.next) startMeeting(t); return; }
  if (meeting.phase === "gather") {
    if (agents.every(a => a.mode === "meet") || t - meeting.startedAt > 28) { meeting.phase = "talk"; meeting.line = -1; meeting.lineAt = t - LINE_SECONDS; }
    return;
  }
  if (meeting.phase === "talk" && t - meeting.lineAt >= LINE_SECONDS) {
    meeting.line++; meeting.lineAt = t;
    const lines = state.meeting.lines;
    if (meeting.line >= lines.length) {
      meeting.phase = "off"; meeting.next = t + MEET_EVERY; speaking = -1; $("phase").textContent = "Expediente";
      agents.forEach(a => goHome(a)); if (tab === "meeting") renderTab(); return;
    }
    const l = lines[meeting.line], a = agents.find(x => x.id === l.who);
    speaking = meeting.line;
    if (a) say(a, l.text.length > 170 ? l.text.slice(0, 167) + "..." : l.text, LINE_SECONDS - 0.4);
    $("phase").textContent = "Reuniao: " + person(l.who).name + " falando";
    if (tab === "meeting") {
      document.querySelectorAll(".line.now").forEach(x => x.classList.remove("now"));
      const row = $("line" + meeting.line); if (row) { row.classList.add("now"); row.scrollIntoView({ block: "nearest", behavior: calm ? "auto" : "smooth" }); }
    }
  }
}

function animateAgent(a, dt, t) {
  const g = a.body.g, p = g.position;
  if (a.mode === "walk") {
    const target = a.path[0];
    if (!target) { a.mode = "idle"; if (a.after) { const f = a.after; a.after = null; f(); } }
    else {
      const dx = target.x - p.x, dz = target.y - p.z, d = Math.hypot(dx, dz);
      if (d < 0.08) a.path.shift();
      else { const s = Math.min(d, a.speed * dt); p.x += dx / d * s; p.z += dz / d * s; a.face = Math.atan2(dx, dz); }
    }
    const sw = Math.sin(t * 9 + a.phase) * 0.55;
    a.body.legL.rotation.x = sw; a.body.legR.rotation.x = -sw; a.body.armL.rotation.x = -sw * 0.8; a.body.armR.rotation.x = sw * 0.8;
    g.position.y = Math.abs(Math.sin(t * 9 + a.phase)) * 0.04;
  } else {
    a.body.legL.rotation.x *= 0.8; a.body.legR.rotation.x *= 0.8; g.position.y = 0;
    if (a.mode === "work") {
      const k = Math.sin(t * 14 + a.phase) * 0.08;
      a.body.armL.rotation.x = -1.05 + k; a.body.armR.rotation.x = -1.05 - k;
      a.body.head.rotation.y = Math.sin(t * 0.7 + a.phase) * 0.25;
    } else {
      a.body.armL.rotation.x = Math.sin(t * 2 + a.phase) * 0.15; a.body.armR.rotation.x = (a.bub.classList.contains("show") ? -0.6 + Math.sin(t * 5) * 0.3 : 0);
      a.body.head.rotation.y = 0;
    }
    if (a.mode === "work" || a.mode === "talk") {
      a.timer -= dt;
      if (a.timer <= 0) { if (a.mode === "talk" && a.onDone) { const f = a.onDone; a.onDone = null; f(); } else decide(a); }
    }
  }
  let diff = a.face - g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); g.rotation.y += diff * Math.min(1, dt * 8);
  if (a.bubbleUntil && t > a.bubbleUntil) { a.bub.classList.remove("show"); a.bubbleUntil = 0; }
}

// labels follow the heads on screen
const v3 = new THREE.Vector3();
function placeLabels(w, h) {
  agents.forEach(a => {
    v3.set(a.body.g.position.x, 2.12, a.body.g.position.z).project(camera);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
    a.tag.style.display = vis ? "" : "none";
    if (vis) a.tag.style.transform = "translate(" + ((v3.x + 1) / 2 * w) + "px," + ((1 - v3.y) / 2 * h) + "px) translate(-50%,-100%)";
  });
}
// tap a person to see their report
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let downAt = null;
canvas.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = canvas.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(agents.map(a => a.body.g), true).find(h => h.object.userData.agent);
  if (hit) focusAgent(hit.object.userData.agent);
});
function focusAgent(id) {
  selected = id; setTab("team");
  const a = agents.find(x => x.id === id); if (!a) return;
  const p = a.body.g.position; flyTo([p.x + 4, 4.5, p.z + 6], [p.x, 1.2, p.z]);
  if (bubbleOf(id)) say(a, bubbleOf(id), 6);
}

// camera moves
let fly = null;
function flyTo(pos, target) { controls.autoRotate = false; fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...pos), t1: new THREE.Vector3(...target), k: 0 }; }
$("camAll").onclick = () => flyTo([15, 17, 23], [0, 0.5, -1.5]);
$("camDesk").onclick = () => flyTo([0, 6.5, 7.5], [0, 1.2, -3]);
$("camMeet").onclick = () => flyTo([-4, 7.5, 5], [-11, 0.8, -3]);

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (fly) {
    fly.k = Math.min(1, fly.k + dt / 1.2); const e = fly.k < 0.5 ? 2 * fly.k * fly.k : 1 - Math.pow(-2 * fly.k + 2, 2) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (fly.k >= 1) fly = null;
  }
  tickMeeting(t);
  agents.forEach(a => animateAgent(a, dt, t));
  controls.update();
  renderer.render(scene, camera);
  const r = canvas.getBoundingClientRect(); placeLabels(r.width, r.height);
  requestAnimationFrame(frame);
}
frame();
connect();
// fonts arrive after the first paint of the screens
if (document.fonts) document.fonts.ready.then(() => { paintScreens(); paintClock(); });
</script>
